# [Protocol Check: Strict Maintenance Mode Active - Detail Preservation 100%]
# FileName: .github/workflows/star-of-africa.yml
# Version: 1.6.1 (Pixel-Level Detail - Single-Dash Enforcement)
# Compliance: ANTI_STUPID_LOGIC_V3_PERMANENT (ZERO OMISSION) [cite: 2026-02-09]

name: 非洲之星-全量质检站

on:
  workflow_dispatch: # 爸爸手动点火
  workflow_run:
    # 物理锁定物理文件名，彻底杜绝版本标题变更导致的监听失效
    workflows: [".github/workflows/main.yml"]
    types:
      - completed

jobs:
  quality_control:
    runs-on: ubuntu-latest
    # 仅在炼化厂成功或手动启动时起航，逻辑不打折
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: write
    
    steps:
      - name: 1. [物理检出] 准备战场环境
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # 保证 Git 历史完整性，杜绝推包时的物理冲突

      - name: 2. [心脏审计] 验证物理核心权限与架构对齐
        # 即使成功过也要审，这是极客的严谨 验证物理核心权限与架构.txt]
        run: |
          chmod +x ./bin/speedtest
          FILE_INFO=$(file ./bin/speedtest)
          echo "🔍 物理文件审计结果: $FILE_INFO"
          if [[ "$FILE_INFO" == *"ARM"* ]]; then
            echo "❌ 架构错误：检测到错误的 ARM64 核心！"
            exit 1
          fi
          echo "✅ 架构验证通过：x86-64 物理心脏已激活"

      - name: 3. [非洲之星] 执行单杠逻辑撞击质检
        # 核心逻辑：全面抛弃双横杠 (--)，死磕单横杠 (-) 执行质检并强制捕获全量 Log.txt]
        # 修正字段：-config, -output, -concurrent, -speed-mode 执行质检并强制捕获全量 Log.txt]
        run: |
          mkdir -p Ranger
          echo "🚀 启动单杠物理撞击..."
          # 放弃所有换行符，单行拉满所有核心参数
          ./bin/speedtest -config Candidate_config.yaml -output Ranger/Gold_Candidate.yaml -speed-mode download -concurrent 5 -timeout 5s 2>&1

      - name: 4. [报警补丁] 质量监控与时间戳置顶记录
        # 逻辑：优质节点不满 30 个即触发物理预警
        run: |
          if [ -f "Ranger/Gold_Candidate.yaml" ]; then
            GOLD_COUNT=$(grep -c "name:" Ranger/Gold_Candidate.yaml || echo 0)
            echo "📊 质检完成，优质节点数: $GOLD_COUNT"
            if [ "$GOLD_COUNT" -lt 30 ]; then
              TZ='Asia/Shanghai' TIMESTAMP=$(date +"%Y-%m-%d %H:%M")
              ALARM_MSG="🚨 [$TIMESTAMP] [非洲之星预警]：初筛优质节点仅余 $GOLD_COUNT 个，源质量下降！"
              # 使用 sed 物理置顶，不破坏原文件结构
              if [ -f "hint-maybeuseful.yml" ]; then
                sed -i "1i $ALARM_MSG" hint-maybeuseful.yml
              else
                echo "$ALARM_MSG" > hint-maybeuseful.yml
              fi
            fi
          else
            echo "❌ 物理错误：未能生成输出文件，扫描链路断裂"
            exit 1
          fi

      - name: 5. [成果归仓] 物理推送到主仓库
        # 逻辑：确保 Gold 节点与报警记录 100% 同步
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add Ranger/Gold_Candidate.yaml hint-maybeuseful.yml
          git commit -m "非洲之星：单杠逻辑收割完成，数据归仓" || exit 0
          git pull --rebase origin main
          git push
