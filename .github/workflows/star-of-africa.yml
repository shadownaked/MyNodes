# [Protocol Check: Strict Maintenance Mode Active - Detail Preservation 100%]
# FileName: .github/workflows/star-of-africa.yml
# Version: 1.7.1 (Source Alignment Edition)

name: 非洲之星-全量质检站

on:
  workflow_dispatch: 
  workflow_run:
    workflows: [".github/workflows/main.yml"]
    types: [completed]

jobs:
  quality_control:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: write
    
    steps:
      - name: 1. [物理检出] 准备战场
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: 2. [矿源核验] 检查源码包是否存在
        # 逻辑：如果没有矿，炼丹炉就得熄火 [cite: 2026-02-09]
        run: |
          if [ ! -f "clash-speedtest-1.8.6.tar.gz" ]; then
            echo "❌ 物理错误：仓库根目录未发现 clash-speedtest-1.8.6.tar.gz"
            exit 1
          fi
          echo "✅ 发现源码矿源，准备开炉！"

      - name: 3. [环境炼化] 准备 Go 1.21
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: 4. [心脏重筑] 源码阉割与现场编译
        # 逻辑：现场解压，sed 物理阉割 Fatalln，go build 生成新心脏
        run: |
          tar -xzf clash-speedtest-1.8.6.tar.gz
          cd clash-speedtest-1.8.6
          # 核心手术：把那两行自作聪明的 Fatalln 删掉 [cite: 2026-02-09]
          sed -i 's/log.Fatalln("please specify the configuration file")/\/\/ 阉割/g' main.go
          sed -i 's/log.Fatalln("please specify the github token")/\/\/ 阉割/g' main.go || true
          go mod tidy
          go build -o ../bin/speedtest-pure main.go
          chmod +x ../bin/speedtest-pure

      - name: 5. [非洲之星] 纯净版撞击质检
        # 逻辑：使用重筑的心脏，不再受 GitHub 环境变量干扰 [cite: 2026-02-09]
        run: |
          mkdir -p Ranger
          ./bin/speedtest-pure -config Candidate_config.yaml -output Ranger/Gold_Candidate.yaml -speed-mode download -concurrent 4 -timeout 5s 2>&1

      - name: 6. [成果归仓] 物理同步
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add Ranger/Gold_Candidate.yaml hint-maybeuseful.yml || true
          git commit -m "非洲之星：源码现场炼化版完成" || exit 0
          git pull --rebase origin main
          git push origin main
