# [Protocol Check: Strict Maintenance Mode Active - Detail Preservation 100%]
# FileName: .github/workflows/star-of-africa.yml
# Version: 1.4.1 (Full Detail - Blackbox Log Edition)
# Compliance: ANTI_STUPID_LOGIC_V3_PERMANENT (ZERO OMISSION) [cite: 2026-02-09]

name: 非洲之星-全量质检站

on:
  workflow_dispatch: # 爸爸手动点火
  workflow_run:
    # 物理锁定文件名，确保监听不受版本标题更名影响 [cite: 2026-02-05]
    workflows: [".github/workflows/main.yml"]
    types:
      - completed

jobs:
  quality_control:
    runs-on: ubuntu-latest
    # 只有在炼化厂成功或手动启动时起航
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: write
    
    steps:
      - name: 1. [物理检出] 准备战场环境
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # 确保 git 历史完整，防止推送到仓库时冲突

      - name: 2. [心脏审计] 验证物理核心权限与架构
        # 即使是测速前，也要确认心脏是否就位 [cite: 2026-02-09]
        run: |
          chmod +x ./bin/speedtest
          FILE_INFO=$(file ./bin/speedtest)
          echo "🔍 物理文件审计结果: $FILE_INFO"
          if [[ "$FILE_INFO" == *"ARM"* ]]; then
            echo "❌ 架构错误：检测到 ARM64 核心，请更换为 x86_64！"
            exit 1
          fi
          echo "✅ 架构对齐：物理心脏已激活"

      - name: 3. [非洲之星] 执行质检并强制捕获全量 Log
        # 使用 tee 命令将标准输出和错误输出全部物理重定向到 test.log
        # 加上 || true 确保即便 speedtest 报错(Exit Code 2)，Workflow 也不会立即中断 [cite: 2026-01-19]
        run: |
          mkdir -p Ranger
          echo "🚀 启动全量扫描（物理 Log 监控模式）..."
          echo "=== 极客物理记录启动: $(date) ===" > test.log
          
          # 核心执行：单行指令防止解析错误，tee -a 负责物理存证
          (./bin/speedtest --config Candidate_config.yaml --output Ranger/Gold_Candidate.yaml --speed-mode download --max-concurrent 5 --timeout 5s) 2>&1 | tee -a test.log || true
          
          echo "=== 物理记录结束 ===" >> test.log

      - name: 4. [报警补丁] 质量监控与置顶预警
        # 基于测速生成的结果进行逻辑判定
        run: |
          if [ -f "Ranger/Gold_Candidate.yaml" ]; then
            GOLD_COUNT=$(grep -c "name:" Ranger/Gold_Candidate.yaml || echo 0)
            echo "📊 质检完成，优质节点数: $GOLD_COUNT" >> test.log
            if [ "$GOLD_COUNT" -lt 30 ]; then
              TZ='Asia/Shanghai' TIMESTAMP=$(date +"%Y-%m-%d %H:%M")
              ALARM_MSG="🚨 [$TIMESTAMP] [非洲之星预警]：初筛优质节点仅余 $GOLD_COUNT 个，源质量下降！"
              # 置顶插入，不覆盖原文件
              if [ -f "hint-maybeuseful.yml" ]; then
                sed -i "1i $ALARM_MSG" hint-maybeuseful.yml
              else
                echo "$ALARM_MSG" > hint-maybeuseful.yml
              fi
            fi
          else
            echo "⚠️ 警告：物理输出文件未生成，请检查 test.log！" >> test.log
          fi

      - name: 5. [黑匣子归仓] 无论成败强制回传 Log
        # if: always() 是最高豁免权，确保日志文件一定能传回仓库 [cite: 2026-01-19]
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # 物理收集所有证据：测试日志、测速结果、报警记录
          git add test.log Ranger/Gold_Candidate.yaml hint-maybeuseful.yml || true
          git commit -m "非洲之星：质检运行记录回传 (含全量 Log)" || exit 0
          git pull --rebase origin main
          git push
