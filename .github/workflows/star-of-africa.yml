# [Protocol Check: Strict Maintenance Mode Active - Detail Preservation 100%]
# FileName: .github/workflows/star-of-africa.yml
# Version: 1.6.4 (Pixel-Level Shortcut - Standard Output Capture)
# Compliance: ANTI_STUPID_LOGIC_V3_PERMANENT [cite: 2026-02-09]

name: 非洲之星-全量质检站

on:
  workflow_dispatch: # 爸爸手动点火
  workflow_run:
    workflows: [".github/workflows/main.yml"]
    types: [completed]

jobs:
  quality_control:
    runs-on: ubuntu-latest
    # 物理判断：仅在炼化厂成功或手动启动时起航
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: write
    
    steps:
      - name: 1. [物理检出] 准备战场环境
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: 2. [心脏审计] 验证核心权限与脉搏
        # 逻辑：在重击前最后确认一次物理路径 验证物理核心权限与架构对齐.txt]
        run: |
          chmod +x ./bin/speedtest
          ls -lh ./bin/speedtest
          ./bin/speedtest -v || echo "⚠️ 警告：核心无版本响应"

      - name: 3. [非洲之星] 缩写化指令撞击质检
        # 核心逻辑：基于 Usage 列表，全面使用短参数缩写 执行原子化指令撞击质检.txt]
        # 1. -c 代替 -config 执行原子化指令撞击质检.txt]
        # 2. -o 代替 -output 执行原子化指令撞击质检.txt]
        # 3. 显式补全 -server-url 默认值，防止非交互 Shell 下的假死 执行原子化指令撞击质检.txt]
        run: |
          mkdir -p Ranger
          echo "🚀 启动缩写化撞击实验..."
          ./bin/speedtest -c Candidate_config.yaml -o Ranger/Gold_Candidate.yaml -speed-mode download -concurrent 4 -timeout 5s -server-url "https://dl.google.com/chrome/mac/universal/stable/GGRO/googlechrome.dmg" 2>&1

      - name: 4. [物理判定] 验证产出物
        run: |
          if [ -s "Ranger/Gold_Candidate.yaml" ]; then
            GOLD_COUNT=$(grep -c "name:" Ranger/Gold_Candidate.yaml || echo 0)
            echo "📊 物理出货：已发现 $GOLD_COUNT 个优质节点"
          else
            echo "❌ 物理报错：出货失败，请检查控制台输出的 Usage 详情"
            [[ "${{ github.event_name }}" == "workflow_dispatch" ]] && exit 1 || exit 0
          fi

      - name: 5. [成果归仓] 物理同步
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add Ranger/Gold_Candidate.yaml hint-maybeuseful.yml || true
          git commit -m "非洲之星：缩写指令撞击完成" || exit 0
          git pull --rebase origin main
          git push origin main
