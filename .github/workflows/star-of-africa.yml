# Version: 1.3.0 (Parameter Specification Alignment)
# Compliance: ANTI_STUPID_LOGIC_V3_PERMANENT (ZERO OMISSION) [cite: 2026-02-09]

name: 非洲之星-全量质检站

on:
  workflow_dispatch: 
  workflow_run:
    workflows: [".github/workflows/main.yml"]
    types:
      - completed

jobs:
  quality_control:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: write
    
    steps:
      - name: 1. [物理检出] 准备战场环境
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 

      - name: 2. [心脏审计] 验证 x86_64 物理架构
        run: |
          chmod +x ./bin/speedtest
          FILE_INFO=$(file ./bin/speedtest)
          echo "🔍 物理文件审计结果: $FILE_INFO"
          if [[ "$FILE_INFO" == *"ARM"* ]]; then
            echo "❌ 架构错误：检测到 ARM64 核心，请重新部署 x86_64！"
            exit 1
          fi
          echo "✅ 架构对齐：物理心脏已激活"

      - name: 3. [非洲之星] 执行全量质检扫描
        # 修正逻辑：根据工具帮助菜单 重新对齐参数
        run: |
          echo "🚀 启动规范化扫描..."
          mkdir -p Ranger
          
          # 像素级参数对齐：
          # --config 为输入源
          # --output 为输出路径
          # --timeout 设为 5s 防止僵死
          # --speed-mode 明确指定为 download 模式
          ./bin/speedtest \
            --config Candidate_config.yaml \
            --output Ranger/Gold_Candidate.yaml \
            --timeout 5s \
            --speed-mode download \
            --max-concurrent 5

      - name: 4. [报警补丁] 质量监控与时间戳记录
        run: |
          if [ ! -f "Ranger/Gold_Candidate.yaml" ]; then
            echo "⚠️ 质检未生成文件，跳过报警逻辑"
          else
            GOLD_COUNT=$(grep -c "name:" Ranger/Gold_Candidate.yaml || echo 0)
            echo "📊 质检完成，优质节点数: $GOLD_COUNT"
            if [ "$GOLD_COUNT" -lt 30 ]; then
              TZ='Asia/Shanghai' TIMESTAMP=$(date +"%Y-%m-%d %H:%M")
              ALARM_MSG="🚨 [$TIMESTAMP] [非洲之星预警]：初筛优质节点仅余 $GOLD_COUNT 个，源质量下降！"
              if [ -f "hint-maybeuseful.yml" ]; then
                sed -i "1i $ALARM_MSG" hint-maybeuseful.yml
              else
                echo "$ALARM_MSG" > hint-maybeuseful.yml
              fi
            fi
          fi

      - name: 5. [成果归仓] 物理推送到主仓库
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add Ranger/Gold_Candidate.yaml hint-maybeuseful.yml || true
          git commit -m "非洲之星：参数对齐后首次归仓" || exit 0
          git pull --rebase origin main
          git push
