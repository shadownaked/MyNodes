# [Strict Maintenance Mode]
# FileName: .github/workflows/star-of-africa.yml
# Version: 1.2.0 (African Star - Physical File Listener)
# Compliance: ANTI_STUPID_LOGIC_V3_PERMANENT (ZERO OMISSION)

name: 非洲之星-全量质检站

on:
  workflow_dispatch: # 支持手动触发
  workflow_run:
    # 物理锁定修复：直接监听文件名，彻底无视版本标题更迭
    workflows: [".github/workflows/main.yml"]
    types:
      - completed

jobs:
  quality_control:
    runs-on: ubuntu-latest
    # 仅在 A 链路成功时或手动触发时执行
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: write
    
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 

      - name: 2. 物理心脏就位
        # 逻辑：赋予 bin 目录下 speedtest 执行权限
        run: |
          chmod +x ./bin/speedtest
          echo "✅ 测速核心已激活"

      - name: 3. 执行非洲之星质检与动态报警
        # 逻辑：读取 Candidate_config.yaml -> 输出到 Ranger/Gold_Candidate.yaml
        # 报警补丁：少于30个则在 hint-maybeuseful.yml 顶端插入时间戳报警
        run: |
          echo "🚀 启动全量扫描（AB 链路）..."
          mkdir -p Ranger
          
          # 执行物理测速
          ./bin/speedtest --config Candidate_config.yaml --output Ranger/Gold_Candidate.yaml --ping 2000 --speed-test --max-concurrent 5 --min-speed 102400 || true
          
          # 统计结果
          GOLD_COUNT=$(grep -c "name:" Ranger/Gold_Candidate.yaml || echo 0)
          echo "📊 质检完成，优质节点数: $GOLD_COUNT"
          
          # 顶端插入报警逻辑
          if [ "$GOLD_COUNT" -lt 30 ]; then
            TZ='Asia/Shanghai' TIMESTAMP=$(date +"%Y-%m-%d %H:%M")
            ALARM_MSG="🚨 [$TIMESTAMP] [非洲之星预警]：初筛优质节点仅余 $GOLD_COUNT 个，源质量大幅下降！"
            
            # 使用 sed 在第 1 行插入，不覆盖原内容
            if [ -f "hint-maybeuseful.yml" ]; then
              sed -i "1i $ALARM_MSG" hint-maybeuseful.yml
            else
              echo "$ALARM_MSG" > hint-maybeuseful.yml
            fi
          fi

      - name: 4. 成果归仓 (Ranger 殿堂)
        # 逻辑：物理提交 Ranger 结果与置顶报警
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add Ranger/Gold_Candidate.yaml hint-maybeuseful.yml || true
          git commit -m "非洲之星：质检完成，Gold 节点入库 ($GOLD_COUNT)" || exit 0
          git pull --rebase origin main
          git push
