# [Protocol Check: Strict Maintenance Mode Active - Detail Preservation 100%]
# FileName: .github/workflows/star-of-africa.yml
# Version: 1.4.0 (Geek Single-Line Enforcement)
# Compliance: ANTI_STUPID_LOGIC_V3_PERMANENT (ZERO OMISSION) [cite: 2026-02-09]

name: 非洲之星-全量质检站

on:
  workflow_dispatch: 
  workflow_run:
    # 物理锁定文件名监听
    workflows: [".github/workflows/main.yml"]
    types:
      - completed

jobs:
  quality_control:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: write
    
    steps:
      - name: 1. [物理检出] 准备工作空间
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 

      - name: 2. [心脏审计] 赋予物理执行权限
        run: |
          chmod +x ./bin/speedtest
          ./bin/speedtest -v || echo "⚠️ 核心响应异常"

      - name: 3. [非洲之星] 极客单行质检扫描
        # 逻辑：基于测试成功的单行指令，物理撞击全量任务
        # 严禁使用 \ 换行符，防止 GitHub Actions 解析车祸
        run: |
          mkdir -p Ranger
          ./bin/speedtest --config Candidate_config.yaml --output Ranger/Gold_Candidate.yaml --speed-mode download --max-concurrent 5 --timeout 5s

      - name: 4. [报警补丁] 动态置顶预警记录
        # 逻辑：如果结果不满 30 个，物理插入报警信息
        run: |
          if [ -f "Ranger/Gold_Candidate.yaml" ]; then
            GOLD_COUNT=$(grep -c "name:" Ranger/Gold_Candidate.yaml || echo 0)
            echo "📊 质检完成，优质节点数: $GOLD_COUNT"
            if [ "$GOLD_COUNT" -lt 30 ]; then
              TZ='Asia/Shanghai' TIMESTAMP=$(date +"%Y-%m-%d %H:%M")
              ALARM_MSG="🚨 [$TIMESTAMP] [非洲之星预警]：初筛优质节点仅余 $GOLD_COUNT 个，源质量下降！"
              sed -i "1i $ALARM_MSG" hint-maybeuseful.yml || echo "$ALARM_MSG" > hint-maybeuseful.yml
            fi
          fi

      - name: 5. [成果归仓] 物理推送到主仓库
        # 逻辑：将 Gold 节点与报警记录物理入库
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add Ranger/Gold_Candidate.yaml hint-maybeuseful.yml
          git commit -m "非洲之星：质检完成，Gold 节点已入库" || exit 0
          git pull --rebase origin main
          git push
