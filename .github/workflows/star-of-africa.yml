# [Protocol Check: Strict Maintenance Mode Active - Detail Preservation 100%]
# FileName: .github/workflows/star-of-africa.yml
# Version: 1.7.4 (Physical Logic Reconstruction)
# Compliance: ANTI_STUPID_LOGIC_V3_PERMANENT [cite: 2026-02-09]

name: 非洲之星-全量质检站

on:
  workflow_dispatch: 
  workflow_run:
    workflows: [".github/workflows/main.yml"]
    types: [completed]

jobs:
  quality_control:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: write
    
    steps:
      - name: 1. [物理检出] 准备工作空间
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: 2. [环境构建] 部署 Go 1.21 编译器
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
          check-latest: true

      - name: 3. [源码手术] 强制逻辑修正与阉割
        # 逻辑：既然它不认长单词，我就在源码层面强行把 "c" 替换成 "config"
        run: |
          tar -xzf clash-speedtest-1.8.6.tar.gz
          cd clash-speedtest-1.8.6
          echo "💉 正在执行参数定义修正手术..."
          # 物理修改参数定义，让它支持你输入的长单词
          sed -i 's/flag.String("c",/flag.String("config",/g' main.go
          sed -i 's/flag.String("o",/flag.String("output",/g' main.go
          sed -i 's/flag.String("m",/flag.String("speed-mode",/g' main.go
          # 阉割掉那两行烦人的 Fatalln 强制校验 [cite: 2026-02-09]
          sed -i 's/log.Fatalln("please specify the configuration file")/\/\/ 阉割/g' main.go
          sed -i 's/log.Fatalln("please specify the github token")/\/\/ 阉割/g' main.go || true

      - name: 4. [心脏重筑] 现场炼化
        run: |
          cd clash-speedtest-1.8.6
          go mod tidy
          go build -ldflags="-s -w" -o ../bin/speedtest-pure main.go
          chmod +x ../bin/speedtest-pure
          echo "🔥 纯净版心脏（长参数兼容型）炼成！"

      - name: 5. [非洲之星] 纯净模式最终撞击
        # 逻辑：现在核心已经物理支持 -config 和 -output 了 [cite: 2026-02-09]
        run: |
          mkdir -p Ranger
          echo "🚀 启动重构版核心撞击..."
          ./bin/speedtest-pure -config Candidate_config.yaml -output Ranger/Gold_Candidate.yaml -speed-mode download -concurrent 4 -timeout 5s 2>&1

      - name: 6. [物理判定] 验证产出物
        run: |
          if [ -s "Ranger/Gold_Candidate.yaml" ]; then
            GOLD_COUNT=$(grep -c "name:" Ranger/Gold_Candidate.yaml || echo 0)
            echo "📊 物理出货：已发现 $GOLD_COUNT 个 Gold 节点"
          else
            echo "❌ 物理报错：即便修改源码也未出货，核心已死，建议切换 Xray-core"
            [[ "${{ github.event_name }}" == "workflow_dispatch" ]] && exit 1 || exit 0
          fi

      - name: 7. [成果归仓] 物理同步
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add Ranger/Gold_Candidate.yaml hint-maybeuseful.yml || true
          git commit -m "非洲之星：源码参数重构实验完成" || exit 0
          git pull --rebase origin main
          git push origin main
