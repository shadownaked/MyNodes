# [Strict Maintenance Mode]
# FileName: .github/workflows/main.yml
# Version: 1.1.1 (Auto-increment).json]
# Adjustment: 注入 Node 执行补丁，物理防御 Exit code 8 报错

name: 西点军校v1.1

on:
  workflow_dispatch: # 遵照爸爸指令，保持手动点火调教模式

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 1. 检出仓库代码
        uses: actions/checkout@v3

      - name: 2. 初始化 Node.js 18 环境
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: 3. 环境与生肉采集
        run: |
          mkdir -p Meet
          curl -L "https://raw.githubusercontent.com/Epodonios/v2ray-configs/main/All_Configs_Sub.txt" -o Meet/raw_meat.txt
          echo "✅ 生肉采集完毕。"

      - name: 4. 执行《镇邪卷》清洗与精锐选拔 (Code 8 防御版)
        run: |
          echo "🛠️ 正在执行物理兼容性处理..."
          # 物理确保脚本具备执行权限，防止环境拒载
          chmod +x DataWashClean.js
          
          echo "📖 启动 JS 清洗引擎 (带 Trace 监控)..."
          # 使用 --trace-uncaught 捕捉导致 Exit code 8 的元凶
          node --trace-uncaught DataWashClean.js
          
          if [ ! -f "Candidate.json" ]; then
            echo "❌ 严重错误：Candidate.json 未产出！"
            exit 1
          fi

          echo "🏹 下载选拔工具..."
          wget https://github.com/xite0/LiteSpeedTest/releases/download/v0.15.0/lite_linux_amd64.tar.gz
          tar -xvf lite_linux_amd64.tar.gz
          chmod +x lite
          
          echo '{"group":"精锐部队","outFormat":"subscription","concurrent":50,"testMethod":"google"}' > speed_config.json
          
          echo "⏱️ 开启生死测试..."
          ./lite -config speed_config.json -sub Candidate.json -test http://www.google.com/generate_204 -timeout 3000 -out EliteTroops_config.yaml

      - name: 5. 成果归仓 (Git Push)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add Candidate.json Candidate_config.yaml EliteTroops_config.yaml
          git commit -m "西点军校v1.1：Code 8 防御部署完毕 $(date)" || exit 0
          git push
