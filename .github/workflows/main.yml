name: 自动清洗订阅源

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v3

      - name: 采集 1.8M 原始生肉
        run: |
          mkdir -p Meet
          curl -L "https://raw.githubusercontent.com/Epodonios/v2ray-configs/main/All_Configs_Sub.txt" -o Meet/raw_meat.txt

      - name: 方案 A：运行 JS 生成 Candidate
        run: node DataWashClean.js

      - name: 方案 B：选拔 EliteTroops (真机测速)
        run: |
          wget https://github.com/xite0/LiteSpeedTest/releases/download/v0.15.0/lite_linux_amd64.tar.gz
          tar -xvf lite_linux_amd64.tar.gz
          chmod +x lite
          # 3秒不通直接扔掉
          ./lite -config '{"outFormat":"subscription"}' -sub Candidate_config.yaml -test http://www.google.com/generate_204 -timeout 3000 -out EliteTroops_config.yaml

      - name: 结果归仓
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add Candidate_config.yaml EliteTroops_config.yaml
          git commit -m "精锐选拔完毕 $(date)" || exit 0
          git push
