name: 自动清洗订阅源

on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v3

      - name: 安装自建转换引擎 (SubConverter)
        run: |
          # 下载官方 Linux 版引擎并解压
          wget https://github.com/tindy2013/subconverter/releases/latest/download/subconverter_linux64.tar.gz
          tar -xvf subconverter_linux64.tar.gz
          # 在后台启动它，默认监听 25500 端口
          ./subconverter/subconverter & 
          sleep 5 # 等它启动完成

      - name: 内部闭环转换
        run: |
          # 现在我们向“自己”发起请求，127.0.0.1 就是云端服务器自己
          # 这样就彻底避开了公共接口的 403 错误和网络波动
          curl -L "http://127.0.0.1:25500/sub?target=clash&url=https%3A%2F%2Fraw.githubusercontent.com%2FEpodonios%2Fv2ray-configs%2Fmain%2FAll_Configs_Sub.txt&insert=false&config=https%3A%2F%2Fraw.githubusercontent.com%2FACL4SSR%2FACL4SSR%2Fmaster%2FClash%2Fconfig%2FACL4SSR_Online_Full_Optimization.ini&emoji=true&list=false&udp=true&tfo=false&scv=false&fdn=false&sort=false&new_name=true" -o my_clash_config.yaml

      - name: 提交成品到仓库
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add my_clash_config.yaml
          git commit -m "自力更生自动更新: $(date)" || exit 0
          git push
