# [Strict Maintenance Mode]
# FileName: .github/workflows/main.yml
# Version: 2.1.0 (Cleanup & Truncate Logic Integrated)
# Compliance: ANTI_STUPID_LOGIC_V3_PERMANENT

name: 西点军校v2.1-全自动炼化厂

on:
  workflow_dispatch:

jobs:
  refine_process:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 1. 检出仓库代码
        uses: actions/checkout@v3

      - name: 2. 初始化 Node.js 18 环境
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: 3. 执行物理清理任务 (基于 cleanup.config)
        # 逻辑：非空则删除并清空，为空则跳过
        run: |
          if [ -s "cleanup.config" ]; then
            echo "🚀 发现清理指令，开始物理移除旧文件..."
            # 过滤注释行并执行删除
            grep -v '^#' cleanup.config | xargs rm -f || true
            grep -v '^#' cleanup.config | xargs git rm --ignore-unmatch || true
            
            # 物理清空文件内容，严禁删除文件本身
            : > cleanup.config
            echo "✅ 清理执行完毕，cleanup.config 已物理清空。"
          else
            echo "📭 cleanup.config 为空，无需清理。"
          fi

      - name: 4. 环境预热
        run: |
          mkdir -p Meet
          chmod +x Harvester.js
          chmod +x DataWashClean.js

      - name: 5. 阶段一：西点军校采集 (Harvester)
        run: node Harvester.js

      - name: 6. 阶段二：炼化厂去泥 (DataWashClean)
        run: |
          node DataWashClean.js
          if [ ! -f "Candidate.json" ]; then
            echo "❌ 严重错误：Candidate.json 未产出！"
            exit 1
          fi

      - name: 7. 成果归仓 (Git Push)
        # 包含 cleanup.config 的空状态记录
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          git add cleanup.config Meet/*.txt Candidate.json Candidate_config.yaml hint-maybeuseful.yml || true
          
          git commit -m "西点军校v2.1：清理并炼化归仓 $(date)" || exit 0
          git push
