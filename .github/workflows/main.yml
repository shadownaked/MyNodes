# [Strict Maintenance Mode]
# FileName: .github/workflows/main.yml
# Version: 1.2.1 (Auto-increment).json]
# Adjustment: 物理剥离测速选拔逻辑，解决因 404 导致的 Code 8 崩溃，专注炼化归仓

name: 西点军校v1.2-炼化厂

on:
  workflow_dispatch: # 保持手动点火调教模式

jobs:
  refine_process:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 1. 检出仓库代码
        uses: actions/checkout@v3

      - name: 2. 初始化 Node.js 18 环境
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: 3. 环境与生肉采集
        run: |
          mkdir -p Meet
          curl -L "https://raw.githubusercontent.com/Epodonios/v2ray-configs/main/All_Configs_Sub.txt" -o Meet/raw_meat.txt
          echo "✅ 生肉采集完毕。"

      - name: 4. 执行《镇邪卷》JS 炼化引擎
        # 仅保留炼化逻辑，确保 2753 条成果能顺利生成
        run: |
          chmod +x DataWashClean.js
          echo "📖 启动 JS 炼化引擎..."
          node DataWashClean.js
          
          if [ ! -f "Candidate.json" ]; then
            echo "❌ 严重错误：炼化失败，未发现 Candidate.json！"
            exit 1
          fi
          echo "🎉 炼化阶段性胜利！"

      - name: 5. 成果归仓 (Git Push)
        # 将炼化出的 Candidate.json 和 Candidate_config.yaml 推送到仓库
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add Candidate.json Candidate_config.yaml
          git commit -m "西点军校v1.2：炼化成果已归仓 $(date)" || exit 0
          git push
