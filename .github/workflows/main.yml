# [Strict Maintenance Mode]
# FileName: .github/workflows/main.yml
# Version: 2.2.0 (Three-Day Harvest & Duck.com Ready)
# Compliance: ANTI_STUPID_LOGIC_V3_PERMANENT

name: 西点军校v2.2-全自动炼化厂

on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'  # - cron: '0 */6 * * *' 北京时间：06:00, 12:00, 18:00, 00:00 自动巡逻

jobs:
  refine_process:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 1. 检出仓库代码
        uses: actions/checkout@v3

      - name: 2. 执行环境清理 (cleanup.config)
        # 逻辑：物理删除名单文件并清空配置
        run: |
          if [ -s "cleanup.config" ]; then
            echo "🚀 执行物理清理..."
            grep -v '^#' cleanup.config | xargs rm -f || true
            grep -v '^#' cleanup.config | xargs git rm --ignore-unmatch || true
            : > cleanup.config
          fi

      - name: 3. 初始化环境与执行炼化
        # 逻辑：Harvester 采集 -> DataWashClean 增量炼化
        run: |
          mkdir -p Meet
          node Harvester.js
          node DataWashClean.js

      - name: 4. 情报收割 (每3天上午10点触发)
        # 逻辑：利用 GitHub Step Summary 触发邮件通知
        # 计算：UTC 02:00 等于北京时间 10:00。使用一年中的天数 % 3 实现周期
        run: |
          HOUR=$(date +%H)
          DAY_OF_YEAR=$(date +%j)
          
          if [ $((10#$DAY_OF_YEAR % 3)) -eq 0 ] && [ "$HOUR" -le "03" ]; then
            if [ -s "hint-maybeuseful.yml" ]; then
              echo "💎 [收割时刻] 发现蓄水池资产，正在生成摘要..."
              echo "## 🚀 西点军校情报摘要 (v2.2 收割)" >> $GITHUB_STEP_SUMMARY
              echo "爸爸，这是过去三天为你积攒的 GitHub 资产链接：" >> $GITHUB_STEP_SUMMARY
              echo "\`\`\`yaml" >> $GITHUB_STEP_SUMMARY
              cat hint-maybeuseful.yml >> $GITHUB_STEP_SUMMARY
              echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
              
              # 发送后物理清空蓄水池
              : > hint-maybeuseful.yml
              echo "✅ 情报已推送到 Summary，蓄水池已清空。"
            else
              echo "📭 蓄水池为空，本次收割跳过。"
            fi
          else
            echo "🕒 非收割窗口（每3天 10:00），继续执行增量积攒模式。"
          fi

      - name: 5. 成果归仓 (Git Push)
        # 逻辑：将炼化后的 Candidate 和积攒的情报状态物理同步回仓库
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # 必须 add 所有变动文件，确保增量状态被记录
          git add cleanup.config Candidate.json Candidate_config.yaml hint-maybeuseful.yml || true
          
          git commit -m "西点军校v2.2：增量炼化与收割存档 $(date)" || exit 0
          git push
