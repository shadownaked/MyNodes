name: 自动清洗订阅源

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v3

      - name: 搭建 Node.js 环境
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: 路径与文件存量自检
        run: |
          echo "当前工作目录: $(pwd)"
          ls -R

      - name: 步骤 1：采集 1.8M 原始生肉
        run: |
          mkdir -p Meet
          curl -L "https://raw.githubusercontent.com/Epodonios/v2ray-configs/main/All_Configs_Sub.txt" -o Meet/raw_meat.txt

      - name: 步骤 2：执行《镇邪卷》清洗
        # 显式指向根目录，防止 Exit code 8 找不到文件
        run: node ./DataWashClean.js

      - name: 步骤 3：真机选拔精锐部队
        run: |
          # 检查 Candidate.json 是否真的生成了
          if [ ! -f "Candidate.json" ]; then
            echo "❌ 错误：清洗脚本未产出 Candidate.json"
            exit 1
          fi
          
          # 下载测速核心
          wget https://github.com/xite0/LiteSpeedTest/releases/download/v0.15.0/lite_linux_amd64.tar.gz
          tar -xvf lite_linux_amd64.tar.gz
          chmod +x lite
          
          # 启动 3 秒生死测试，将 Candidate.json 转化为 Candidate_config.yaml (精锐版)
          # 注意：这里我们统一命名为 Candidate_config.yaml 方便你查看
          ./lite -test http://www.google.com/generate_204 -timeout 3000 -out Candidate_config.yaml Candidate.json

      - name: 步骤 4：成果归仓
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # 强制添加所有生成的成果
          git add Candidate.json Candidate_config.yaml
          git commit -m "精锐部队选拔完毕: $(date)" || exit 0
          git push
