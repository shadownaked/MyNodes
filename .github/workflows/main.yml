# [Strict Maintenance Mode]
# FileName: .github/workflows/main.yml
# Version: 2.0.1 (Harvester Logic Integrated)
# Adjustment: 1. 引入西点军校采集步骤 2. 物理保留 hint.yml 成果 3. 增强 Git 提交逻辑

name: 西点军校v2.0-全自动炼化厂

on:
  workflow_dispatch: # 保持手动调教模式，方便观察日志

jobs:
  refine_process:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 1. 检出仓库代码
        uses: actions/checkout@v3

      - name: 2. 初始化 Node.js 18 环境
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: 3. 环境预热
        run: |
          mkdir -p Meet
          # 赋予两个核心脚本物理执行权限
          chmod +x Harvester.js
          chmod +x DataWashClean.js
          echo "✅ 军校环境初始化完毕。"

      - name: 4. 阶段一：西点军校采集 (Harvester)
        # 这一步会执行随机休眠，请耐心等待 2753 条生肉归位
        run: |
          echo "📡 西点军校开始出动..."
          node Harvester.js
          echo "✅ 采集阶段结束，检查生肉库："
          ls -F Meet/

      - name: 5. 阶段二：炼化厂去泥 (DataWashClean)
        run: |
          echo "📖 炼化厂开始深加工..."
          node DataWashClean.js
          if [ ! -f "Candidate.json" ]; then
            echo "❌ 严重错误：Candidate.json 未产出！"
            exit 1
          fi
          echo "✅ 炼化阶段结束。"

      - name: 6. 成果归仓 (Git Push)
        # 提交内容包含：生肉库(Meet)、炼化成果(Candidate)、情报单(hint.yml)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # 动态添加所有生成的文件
          git add Meet/*.txt Candidate.json Candidate_config.yaml hint.yml || true
          
          git commit -m "西点军校v2.0：采集与炼化全量归仓 $(date)" || exit 0
          git push
