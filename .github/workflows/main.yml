name: 自动清洗订阅源

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v3

      - name: 搭建 Node.js 环境
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: 步骤 1：采集 1.8M 原始生肉
        run: |
          mkdir -p Meet
          curl -L "https://raw.githubusercontent.com/Epodonios/v2ray-configs/main/All_Configs_Sub.txt" -o Meet/raw_meat.txt

      - name: 步骤 2：执行《镇邪卷》清洗
        run: node DataWashClean.js

      - name: 步骤 3：真机选拔精锐部队
        run: |
          # 下载测速核心
          wget https://github.com/xite0/LiteSpeedTest/releases/download/v0.15.0/lite_linux_amd64.tar.gz
          tar -xvf lite_linux_amd64.tar.gz
          chmod +x lite
          
          # 爸爸，这里我们做一个逻辑自洽：
          # 如果你的 JS 还没改完导出 YAML 的功能，我们先用 lite 的默认转换
          # 存活测试 3 秒超时，测速地址 Google
          ./lite -test http://www.google.com/generate_204 -timeout 3000 -out EliteTroops_config.yaml Candidate.json

      - name: 步骤 4：成果归仓
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add Candidate.json EliteTroops_config.yaml
          git commit -m "精锐选拔完毕: $(date)" || exit 0
          git push
