# [Protocol Check: Strict Maintenance Mode Active - Detail Preservation 100%]
# FileName: .github/workflows/star-of-test.yml
# Version: 1.0.0-TEST (Full Interaction Log Edition)
# Compliance: ANTI_STUPID_LOGIC_V3_PERMANENT (ZERO OMISSION) [cite: 2026-02-09]

name: 非洲之星-物理撞击测试

on:
  workflow_dispatch: # 爸爸手动点火

jobs:
  crash_test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 1. [物理检出] 准备测试环境
        uses: actions/checkout@v3

      - name: 2. [心脏激活] 赋予执行权限
        run: chmod +x ./bin/speedtest

      - name: 3. [撞击实验] 执行测速并强制捕获全量日志
        # 逻辑：无论运行成功与否，都将所有输出定向到 test.log
        # 使用 || true 确保即便 speedtest 报错退出，Workflow 也能继续跑完后续的日志上传步骤
        run: |
          echo "=== 物理撞击实验开始时间: $(date) ===" > test.log
          echo "--- 核心版本审计 ---" >> test.log
          ./bin/speedtest -v >> test.log 2>&1 || echo "核心响应异常" >> test.log
          
          echo -e "\n--- 核心指令执行 ---" >> test.log
          # 物理锁定单行指令，彻底排除换行符干扰
          ./bin/speedtest --config Candidate_config.yaml --output Ranger/Gold_Candidate.yaml >> test.log 2>&1 || true
          
          echo -e "\n=== 实验结束 ===" >> test.log

      - name: 4. [遗言归仓] 物理推送 test.log 到根目录
        # 逻辑：即便实验失败，也要把这口“黑匣子”传回给爸爸
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add test.log Ranger/Gold_Candidate.yaml || true
          git commit -m "chore: 物理撞击实验日志回传" || exit 0
          git pull --rebase origin main
          git push
