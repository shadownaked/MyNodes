# [Strict Maintenance Mode]
# FileName: .github/workflows/deploy-heart.yml
# Task: 物理突破25MB限制，云端解压测速核心
# Compliance: ZERO OMISSION

name: 0-心脏部署：物理突破25MB上传限制

on:
  workflow_dispatch: # 爸爸手动点击触发

jobs:
  unpack_heart:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v3

      - name: 2. 执行云端解压逻辑
        # 逻辑：进入bin目录 -> 解压 -> 重命名为 speedtest -> 赋予执行权限
        run: |
          cd bin
          tar -xzvf clash-speedtest_Linux_arm64.tar.gz
          # 找到解压出来的二进制文件并重命名
          mv clash-speedtest speedtest
          chmod +x speedtest
          # 物理清理压缩包，节省空间
          rm clash-speedtest_Linux_arm64.tar.gz
          echo "✅ 心脏解压并命名成功。"

      - name: 3. 物理入库
        # 逻辑：将解压后的 28MB 二进制文件强制推送到仓库
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add bin/speedtest
          git commit -m "chore: 物理部署测速核心 (28MB Bypass)" || exit 0
          git push
